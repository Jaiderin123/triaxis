server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: triaxis-assistant-service
  reactor:
    context-propagation: auto
  lifecycle:
    timeout-per-shutdown-phase: 20s
  codec:
    max-in-memory-size: 64KB
  # Connection settings come from the environment (the local profile has development defaults).
  r2dbc:
    url: ${ASSISTANT_DB_URL:}
    username: ${ASSISTANT_DB_USER:}
    password: ${ASSISTANT_DB_PASSWORD:}
    pool:
      # Explicit limits: without them the pool waits forever for a connection (r2dbc-pool has no default).
      max-size: 10
      max-acquire-time: 5s
      max-create-connection-time: 5s
      max-validation-time: 2s
  autoconfigure:
    # This Spring AI auto-configuration ignores spring.ai.model.embedding.text and asks for Gemini credentials
    # even when Gemini is not used; the gemini profile includes it again.
    exclude: org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # The urgency view has its own consumer group; offsets are committed only after Redis applied the event.
      group-id: assistant-urgency-view
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 50
    listener:
      # Continues the trace of the request that caused the event (traceparent header).
      observation-enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  ai:
    model:
      # Spring AI auto-configuration of Gemini is off; the gemini profile turns it on (ADR 0008).
      chat: none
      embedding:
        text: none
  jackson:
    mapper:
      # No silent conversion of numbers or booleans into the question text.
      allow-coercion-of-scalars: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      # The whole script is sent as one statement.
      separator: "^^^ END OF SCRIPT ^^^"

logging:
  structured:
    format:
      # JSON logs (Elastic Common Schema) on the console; the local profile switches to plain text.
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,r2dbc,redis
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        # Off unless a collector is configured, so the service runs without one.
        enabled: ${TRACING_EXPORT_ENABLED:false}

triaxis:
  database:
    # Session limits set by R2dbcSessionConfiguration (PostgreSQL statement_timeout and lock_timeout).
    statement-timeout: PT10S
    lock-timeout: PT5S
  web:
    metrics:
      # Credentials of the metrics scraper; without a password /actuator/prometheus is denied.
      username: ${METRICS_USER:metrics}
      password: ${METRICS_PASSWORD:}
  security:
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8083/.well-known/jwks.json}

assistant:
  llm:
    # mock (default: no key, deterministic) or gemini (use the gemini profile, which also sets this).
    provider: mock
    timeout:
      embedding: PT5S
      answer: PT20S
      retry-after: PT30S
  rag:
    top-k: 4
    # Calibrated for the mock embedding with the three sample questions: the relevant sections are at 0.47 and
    # 0.60, the closest section to the diabetes question at 0.82 (ASSUMPTIONS A36).
    max-distance: 0.70
    question-max-length: 1000
    # Longest wait for the similarity search; a failure or timeout of the database is a 503 (ADR 0004).
    search-timeout: PT3S
  urgency:
    # A discharged patient is remembered longer than the topic keeps events (7 days), see ADR 0021.
    discharged-ttl: P30D
    redis-timeout: PT2S
    max-in-flight: 64
    reset-timeout: PT30S
    startup-check:
      # When Redis does not answer at partition assignment: retries, then a restart of the listener later.
      attempts: 5
      backoff: PT2S
      restart-delay: PT30S
  corpus:
    location: classpath:/protocols/
    retry:
      initial-backoff: PT2S
      max-backoff: PT1M

# Circuit breaker of the language model calls (ADR 0004): it opens when half of the last ten calls failed (at
# least five calls), stays open 30 seconds, then lets three trial calls through.
resilience4j:
  circuitbreaker:
    instances:
      llm:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

