plugins {
	id 'java'
	alias(libs.plugins.spring.boot)
}

dependencyManagement {
	imports {
		mavenBom libs.spring.ai.bom.get().toString()
	}
}

dependencies {
	implementation project(':triaxis-common')
	implementation project(':triaxis-security')
	implementation project(':triaxis-web')

	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.postgresql:r2dbc-postgresql'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	implementation libs.mapstruct
	annotationProcessor libs.mapstruct.processor

	implementation libs.resilience4j.spring.boot3
	implementation libs.resilience4j.reactor
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	// Gemini chat and embeddings (ADR 0008). Their auto-configuration is off unless the gemini profile is active
	// (spring.ai.model.chat and spring.ai.model.embedding.text are none by default), so no key is needed otherwise.
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation testFixtures(project(':triaxis-security'))
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:kafka'
	testImplementation 'org.testcontainers:r2dbc'
	testImplementation libs.archunit.junit5
	testImplementation libs.blockhound
	// Compile scope for the listener that installs BlockHound before any test (BlockHoundSessionListener).
	testImplementation 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += [
		'-Amapstruct.defaultComponentModel=spring',
		'-Amapstruct.unmappedTargetPolicy=ERROR'
	]
}
