apiVersion: v1
kind: Service
metadata:
  name: triage
spec:
  selector:
    app: triage
  ports:
    - port: 8081
---
# One replica (A39, A47). No CPU limit, so the JVM can use the node at startup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage
  template:
    metadata:
      labels:
        app: triage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      # The schema is applied at startup: wait for PostgreSQL instead of crashing and backing off.
      initContainers:
        - name: wait-for-postgres
          image: pgvector/pgvector:0.8.7-pg16-bookworm
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U triaxis -q; do sleep 2; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: triage
          image: triaxis-triage
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: triaxis-config
          env:
            - name: METRICS_PASSWORD
              valueFrom:
                secretKeyRef: {name: triaxis-secrets, key: METRICS_PASSWORD}
            - name: TRIAGE_DB_USER
              valueFrom:
                configMapKeyRef: {name: triaxis-config, key: DB_USER}
            - name: TRIAGE_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: triaxis-secrets, key: POSTGRES_PASSWORD}
            # Only when a webhook channel is configured (ADR 0011); the log channel needs nothing.
            - name: ALERT_WEBHOOK_URL
              valueFrom:
                secretKeyRef: {name: triaxis-secrets, key: ALERT_WEBHOOK_URL, optional: true}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8081}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8081}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8081}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 448Mi}
            limits: {memory: 640Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
