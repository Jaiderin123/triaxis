apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
    - port: 8083
---
# One replica (A39, A47). No CPU limit, so the JVM can use the node at startup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth
          image: triaxis-auth
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: triaxis-config
          env:
            - name: METRICS_PASSWORD
              valueFrom:
                secretKeyRef: {name: triaxis-secrets, key: METRICS_PASSWORD}
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef: {name: triaxis-secrets, key: JWT_PRIVATE_KEY}
            - {name: AUTH_USERS_0_USERNAME, value: nurse}
            - {name: AUTH_USERS_0_ROLES, value: NURSE}
            - name: AUTH_USERS_0_PASSWORDHASH
              valueFrom:
                secretKeyRef: {name: triaxis-secrets, key: NURSE_PASSWORD_HASH}
            - {name: AUTH_USERS_1_USERNAME, value: doctor}
            - {name: AUTH_USERS_1_ROLES, value: DOCTOR}
            - name: AUTH_USERS_1_PASSWORDHASH
              valueFrom:
                secretKeyRef: {name: triaxis-secrets, key: DOCTOR_PASSWORD_HASH}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8083}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8083}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8083}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
