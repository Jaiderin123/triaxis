# One entry point with path routing (ADR 0010). /actuator is not routed (ADR 0020, A29): health and metrics
# stay inside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: triaxis
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service: {name: auth, port: {number: 8083}}
          - path: /.well-known/jwks.json
            pathType: Exact
            backend:
              service: {name: auth, port: {number: 8083}}
          - path: /triage
            pathType: Prefix
            backend:
              service: {name: triage, port: {number: 8081}}
          - path: /asistente
            pathType: Prefix
            backend:
              service: {name: assistant, port: {number: 8082}}
