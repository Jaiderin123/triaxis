apiVersion: v1
kind: Service
metadata:
  name: assistant
spec:
  selector:
    app: assistant
  ports:
    - port: 8082
---
# One replica (A47; the assistant must run as one, A39). No CPU limit, so the JVM can use the node at startup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistant
  template:
    metadata:
      labels:
        app: assistant
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      # The schema is applied at startup: wait for PostgreSQL instead of crashing and backing off.
      initContainers:
        - name: wait-for-postgres
          image: pgvector/pgvector:0.8.7-pg16-bookworm
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U triaxis -q; do sleep 2; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: assistant
          image: triaxis-assistant
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: triaxis-config
          env:
            - name: METRICS_PASSWORD
              valueFrom:
                secretKeyRef: {name: triaxis-secrets, key: METRICS_PASSWORD}
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef: {name: triaxis-config, key: ASSISTANT_PROFILES}
            - name: ASSISTANT_DB_USER
              valueFrom:
                configMapKeyRef: {name: triaxis-config, key: DB_USER}
            - name: ASSISTANT_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: triaxis-secrets, key: POSTGRES_PASSWORD}
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: triaxis-secrets, key: REDIS_PASSWORD}
            # Only with the gemini profile (A16).
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: {name: triaxis-secrets, key: GEMINI_API_KEY, optional: true}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8082}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8082}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8082}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
