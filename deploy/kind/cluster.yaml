# Local cluster for validating the manifests (deploy/scripts/kind-up.sh). The Ingress answers on
# http://localhost:8088 (NodePort 30080 of Traefik).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: triaxis
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8088
        listenAddress: "127.0.0.1"
        protocol: TCP
