server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: triaxis-triage-service
  reactor:
    context-propagation: auto
  lifecycle:
    timeout-per-shutdown-phase: 20s
  codec:
    max-in-memory-size: 64KB
  # Connection settings come from the environment (the local profile has development defaults).
  r2dbc:
    url: ${TRIAGE_DB_URL:}
    username: ${TRIAGE_DB_USER:}
    password: ${TRIAGE_DB_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      # The whole script is sent as one statement, so the trigger function body is not split at its semicolons.
      separator: "^^^ END OF SCRIPT ^^^"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      # Do not wait long for the topic check when the broker is down.
      operation-timeout: 5s
      fail-fast: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        request.timeout.ms: 10000
        delivery.timeout.ms: 15000
        max.block.ms: 5000
  jackson:
    deserialization:
      # Integers must not accept decimals (93.5 is rejected instead of silently truncated).
      accept-float-as-int: false
    mapper:
      # No silent conversion of strings into numbers.
      allow-coercion-of-scalars: false

logging:
  structured:
    format:
      # JSON logs (Elastic Common Schema) on the console; the local profile switches to plain text.
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,r2dbc
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        # Off unless a collector is configured, so the service runs without one.
        enabled: ${TRACING_EXPORT_ENABLED:false}

triaxis:
  web:
    metrics:
      # Credentials of the metrics scraper; without a password /actuator/prometheus is denied.
      username: ${METRICS_USER:metrics}
      password: ${METRICS_PASSWORD:}
  security:
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8083/.well-known/jwks.json}

triage:
  sla:
    minutes:
      CRITICAL: 5
      URGENT: 10
      URGENT_2: 30
      NOT_URGENT: 60
      NOT_URGENT_2: 120
  administrative-complaints:
    - documentos
    - recoleccion de resultados
    - renovacion de recetario
    - vacunacion
    - seguimiento
  escalation:
    # Patients that exceeded their SLA are flagged by one atomic statement per batch (RF-03, ADR 0006).
    enabled: true
    interval: PT30S
    batch-size: 100
  outbox:
    relay:
      enabled: true
      interval: PT1S
      batch-size: 50
      send-timeout: PT15S
    topic:
      partitions: 3
      replicas: 1
