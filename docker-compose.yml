# Triaxis with one command: `docker compose up --build` starts the infrastructure and the three services.
# For local development with Gradle, start only the infrastructure: `docker compose up -d postgres kafka kafka-init redis`.
# Credentials below are local development defaults only. Override them with environment variables or a local
# .env file (never commit .env). Every port is published on 127.0.0.1 only.
name: triaxis

x-service: &service
  restart: unless-stopped
  environment: &service-env
    METRICS_USER: ${METRICS_USER:-metrics}
    METRICS_PASSWORD: ${METRICS_PASSWORD:-metrics-local}
    TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-triaxis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triaxis}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Creates the topic with an explicit retention of 7 days (ADR 0021).
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
      --create --if-not-exists --topic triaje.eventos --partitions 3 --replication-factor 1
      --config retention.ms=604800000

  redis:
    image: redis:7.4.12-alpine3.22
    # The urgency view must never be evicted (ADR 0021).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-triaxis-local}", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-triaxis-local}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-triaxis-local}

  # Traces (OpenTelemetry). Services export to it when TRACING_EXPORT_ENABLED=true; the UI is on port 16686.
  jaeger:
    image: jaegertracing/jaeger:2.4.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  auth:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: auth
    image: triaxis-auth:local
    environment:
      <<: *service-env
      # Demonstration users (nurse / nurse-demo, doctor / doctor-demo) and a signing key generated at startup:
      # local only, never in a deployment.
      AUTH_JWT_GENERATEKEYIFMISSING: "true"
      AUTH_USERS_0_USERNAME: nurse
      AUTH_USERS_0_PASSWORDHASH: "$$2a$$10$$NbaiOfDs1vyhQwwIGczMeedwqNa32Zvrc235tMisVMKkEBpnAlNmq"
      AUTH_USERS_0_ROLES: NURSE
      AUTH_USERS_1_USERNAME: doctor
      AUTH_USERS_1_PASSWORDHASH: "$$2a$$10$$GnQPXp5gAWXuTJVovHGY5u.yfjJBmSPtZ/pByA9ewIyLx9AONMJaa"
      AUTH_USERS_1_ROLES: DOCTOR
    ports:
      - "127.0.0.1:8083:8083"

  triage:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: triage
    image: triaxis-triage:local
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auth:
        condition: service_started
    environment:
      <<: *service-env
      TRIAGE_DB_URL: r2dbc:postgresql://postgres:5432/triage
      TRIAGE_DB_USER: ${POSTGRES_USER:-triaxis}
      TRIAGE_DB_PASSWORD: ${POSTGRES_PASSWORD:-triaxis}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_JWKS_URI: http://auth:8083/.well-known/jwks.json
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      TRIAGE_ALERTS_CHANNEL: ${TRIAGE_ALERTS_CHANNEL:-log}
    ports:
      - "127.0.0.1:8081:8081"

  assistant:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: assistant
    image: triaxis-assistant:local
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      auth:
        condition: service_started
    environment:
      <<: *service-env
      # The mock provider by default; ASSISTANT_PROFILES=gemini with GEMINI_API_KEY uses Gemini (ADR 0008).
      SPRING_PROFILES_ACTIVE: ${ASSISTANT_PROFILES:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ASSISTANT_DB_URL: r2dbc:postgresql://postgres:5432/assistant
      ASSISTANT_DB_USER: ${POSTGRES_USER:-triaxis}
      ASSISTANT_DB_PASSWORD: ${POSTGRES_PASSWORD:-triaxis}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-triaxis-local}
      AUTH_JWKS_URI: http://auth:8083/.well-known/jwks.json
    ports:
      - "127.0.0.1:8082:8082"

volumes:
  postgres-data:
