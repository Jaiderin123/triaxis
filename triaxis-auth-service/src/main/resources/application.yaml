server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: triaxis-auth-service
  reactor:
    context-propagation: auto
  lifecycle:
    timeout-per-shutdown-phase: 20s
  codec:
    max-in-memory-size: 64KB
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration

logging:
  structured:
    format:
      # JSON logs (Elastic Common Schema) on the console; the local profile switches to plain text.
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        # Off unless a collector is configured, so the service runs without one.
        enabled: ${TRACING_EXPORT_ENABLED:false}

triaxis:
  web:
    metrics:
      # Credentials of the metrics scraper; without a password /actuator/prometheus is denied.
      username: ${METRICS_USER:metrics}
      password: ${METRICS_PASSWORD:}

auth:
  jwt:
    issuer: triaxis-auth
    audience: triaxis
    ttl: PT15M
    # PKCS#8 PEM private key, provided only through the environment.
    private-key: ${JWT_PRIVATE_KEY:}
  rate-limit:
    # Attempts allowed on the token endpoint per username and per address in each window.
    max-attempts: 10
    window: PT1M
