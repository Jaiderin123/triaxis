server:
  port: 8083

spring:
  application:
    name: triaxis-auth-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration

management:
  endpoint:
    health:
      probes:
        enabled: true

auth:
  jwt:
    issuer: triaxis-auth
    ttl: PT15M
    # PKCS#8 PEM private key, provided only through the environment.
    private-key: ${JWT_PRIVATE_KEY:}
